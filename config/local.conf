DISTRO ?= 'fslc-xwayland'
MACHINE ??= 'coral-dev'
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
CONF_VERSION = "2"

DL_DIR ?= "${BSPDIR}/downloads/"
ACCEPT_FSL_EULA = "1"
IMAGE_INSTALL:append = " python3-edgetpu-examples v4l-utils"
# Minimal GStreamer for camera capture and go2rtc. Avoid the default
# X11/Wayland/pango/theora/vorbis/soup/cairo/flac/lame/mpg123/speex/taglib/orc
# dependencies to keep the build small.
IMAGE_INSTALL:append = " gstreamer1.0 gstreamer1.0-plugins-base-meta gstreamer1.0-plugins-good-meta"
PACKAGECONFIG:pn-gstreamer1.0-plugins-base = ""
PACKAGECONFIG:pn-gstreamer1.0-plugins-good = "v4l2 jpeg"
ERROR_QA:remove = "patch-status"

# The build server can be busy compiling GCC/clang for minutes at a time;
# keep the client from declaring the server dead after 60 seconds.
BB_SERVER_TIMEOUT = "1800"

# clang-native alone spawns one cc1plus per job; 24 jobs exhausted the
# 23 GiB host. Keep the peak well below the available memory.
BB_NUMBER_THREADS = "8"
PARALLEL_MAKE = "-j 8"

# The image does not ship ptests; curl's ptest build fails and is not
# needed for core-image-base. systemd 262 runs natively on the 6.12
# kernel; keep the distro's systemd default.
DISTRO_FEATURES:remove = "ptest"

OLDEST_KERNEL = "5.4"
# Set root credentials or use SSH keys. Do not enable empty root login.
